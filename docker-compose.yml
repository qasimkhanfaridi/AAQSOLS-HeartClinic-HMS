services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hms-sql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=HeartClinic@2026!AzurePass
      - MSSQL_PID=Express
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HeartClinic@2026!AzurePass' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=HeartClinicHms;User Id=sa;Password=HeartClinic@2026!AzurePass;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - UseSqlite=false
      - Jwt__Key=AAQSOLS-PulseCore-HeartClinic-Azure-Production-Key-2026!
      - PORT=8080
    expose:
      - "8080"

  web:
    build:
      context: ./src/Web
      dockerfile: Dockerfile
    container_name: hms-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  sql_data:
